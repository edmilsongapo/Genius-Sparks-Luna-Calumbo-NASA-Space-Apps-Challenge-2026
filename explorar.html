<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Explorar a Lua · Luna Calumbo</title><link rel="stylesheet" href="css/main.css">
<style>body{overflow:hidden;touch-action:none}#w{position:fixed;inset:0}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:5}
.pl{background:#070a12cc;border:1px solid var(--ln);border-left:4px solid var(--red);padding:8px 12px;border-radius:6px;color:#ece7da;font-size:14px;max-width:420px}
#hint{position:fixed;left:0;right:0;bottom:130px;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 6px #000;z-index:5}
#joy{position:fixed;left:18px;bottom:22px;width:110px;height:110px;border-radius:50%;border:2px solid #fff6;background:#0006;z-index:6;touch-action:none}#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffc}
#acts{position:fixed;right:14px;bottom:22px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:230px;z-index:6}#acts button{width:56px;height:56px;border-radius:50%;border:2px solid var(--gd);background:#0008;color:#fff;font:700 13px inherit}
.pl a{pointer-events:auto;color:var(--gd)}</style></head><body><div id="w"></div>
<div id="hud"><div class="pl"><b>Explorar a Lua</b><br><span id="sc">Amostras: 0/6</span><br><span id="tips">WASD mover · Shift correr · Espaço saltar · E interagir · F acenar · G dançar · B plantar bandeira · X sentar · arrastar para rodar a câmara</span></div><div class="pl"><a href="#" id="bHg">Hangar</a> · <a href="mission.html">Mission Control</a></div></div>
<div id="hint" aria-live="polite"></div><div class="pl" id="msg" style="position:fixed;left:50%;transform:translateX(-50%);top:90px;z-index:5;display:none;text-align:center"></div>
<div id="hg" class="pl" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(92vw,380px);font-size:15px"><b>Hangar: monta a tua nave</b>
<label for="s1">Andares: <span id="v1"></span></label><input id="s1" type="range" min="1" max="4" value="2">
<label for="s2">Motores: <span id="v2"></span></label><input id="s2" type="range" min="1" max="4" value="2">
<label for="s3">Nariz</label><select id="s3"><option value="0">Cónica</option><option value="1">Arredondada</option></select>
<label for="s4">Cores</label><select id="s4"><option value="0">Branca, vermelha e preta (Angola)</option><option value="1">Preta e dourada</option><option value="2">Vermelha</option></select>
<p id="hs" aria-live="polite"></p><button class="btn" id="hx">Fechar e voltar à Lua</button></div>
<div id="joy" aria-label="Joystick"><div id="knob"></div></div><div id="acts"><button id="bDance">Dançar</button><button id="bFlag">Bandeira</button><button id="bSit">Sentar</button><button id="bWave">Acenar</button><button id="bJump">Saltar</button><button id="bAct">Usar</button></div>
<script src="js/three.min.js"></script><script src="js/world.js"></script><script>
const $=i=>document.getElementById(i);let tm;
const WD=LunaWorld({el:$('w'),mode:'play',onHint:t=>$('hint').textContent=t,onScore:(a,b)=>$('sc').textContent=`Amostras: ${a}/${b}`,onMsg:t=>{const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(tm);tm=setTimeout(()=>m.style.display='none',5000)}});

const g=i=>+$(i).value;function up(){const c={st:g('s1'),en:g('s2'),nose:g('s3'),col:g('s4')};$('v1').textContent=c.st;$('v2').textContent=c.en;WD.build(c);const k=WD.perf(c);$('hs').textContent='Empuxo/peso: '+k.toFixed(2)+(k<.7?' (fraco: a nave mal sobe)':k>1.3?' (muito bom)':' (bom)')+'. Vai à nave e carrega em E para a ligar.'}
['s1','s2','s3','s4'].forEach(i=>$(i).addEventListener('input',up));up();
$('bHg').onclick=e=>{e.preventDefault();$('hg').style.display='block';WD.setPause(true)};$('hx').onclick=()=>{$('hg').style.display='none';WD.setPause(false)};
</script></body></html>
